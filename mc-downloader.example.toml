# mc-downloader 配置示例
#
# 优先级：CLI 显式给 > 本文件 > 内置默认
# 未知字段会直接报错（防止手误打错 key 却静默不生效）

[network]
# 空字符串 = 显式直连
proxy = ""
# 单文件失败重试次数（指数退避 1s/2s/4s…）
retry = 3
# 预留：单次请求超时（当前未接线）
timeout_secs = 30

[download]
# 同时下载的文件数
concurrency = 16
# 单文件分片并发（实测 4 最优；8/16/32 反而更慢）
piece_conns = 4
# AIMD 自适应（worker 上限 = 2 × piece_conns）
adaptive = false

[task]
# "mc" | "generic"
mode = "mc"

# ---------- mode = "mc" ----------
[task.mc]
version = "26.3"
dir = "D:/Games/.minecraft"

# ---------- mode = "generic" ----------
# 用 mode = "generic" 时改成下面这段（并把 mode 改成 "generic"）
[task.generic]
