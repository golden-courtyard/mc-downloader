# mc-downloader 下载脚本示例
#
# 用法：mc-downloader run mc-downloader.example.toml
#
# 结构：
#   [network]   全局网络
#   [download]  全局并发
#   [[task]]    任务清单，按声明顺序串行执行
#
# 未知字段会直接报错（防止拼错 key 却静默不生效）

[network]
# 空字符串 = 显式直连
proxy = ""
retry = 3

[download]
concurrency = 16
piece_conns = 4     # 实测 4 最优
adaptive = false

# ---------- 任务 1：下载某个 MC 原版 ----------
[[task]]
kind = "mc"
version = "26.3"
dir = "D:/Users/lmq/.minecraft"

