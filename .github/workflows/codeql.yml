name: CodeQL

# 静态安全扫描（issue #17 建议 6）。
#
# Rust 的提取在 CodeQL 里比较新：如果这一步在 CI 上跑不起来（提取失败/需要夜间版），
# **删掉这个 workflow**，并把结论写进 issue #17 —— 不留一个红门禁或 continue-on-error 的假门禁。

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      # CodeQL 会读本次 workflow run 的信息（遥测/状态）；缺这条会以
      # "Resource not accessible by integration" 失败 —— 2026-11-23 实测过。
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@v4
