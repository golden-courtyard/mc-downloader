name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # 关掉增量编译：本机增量缓存坏过（cargo build --tests 卡在 Compiling 直到超时），
  # CI 上保持一致行为，也避免缓存 key 撞车时表现不一致。
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          rustup update stable
          rustup component add rustfmt clippy
          cargo -V && rustc -V

      - uses: Swatinem/rust-cache@v2

      # 基线自检：Cargo.toml 的 rust-version 会被 cargo 强制。
      # 这一步单纯为了在日志里留下「实际编译器版本 >= 声明基线」的证据。
      - name: Baseline
        run: |
          rustc -V
          grep -E '^(edition|rust-version)' Cargo.toml

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      # 本地也跑得了（CARGO_TARGET_DIR 指到仓库外即可绕开沙箱的路径限制）。
      # 放这里是为了两件本地替代不了的事：Linux 平台，以及 --locked 的一致性。
      - name: Build (release)
        run: cargo build --release --locked
