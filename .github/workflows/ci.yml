name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # 关掉增量编译：本机增量缓存坏过（cargo build --tests 卡在 Compiling 直到超时），
  # CI 上保持一致行为，也避免缓存 key 撞车时表现不一致。
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          rustup update stable
          rustup component add rustfmt clippy
          cargo -V && rustc -V

      - uses: Swatinem/rust-cache@v2

      # 基线自检：Cargo.toml 的 rust-version 会被 cargo 强制。
      # 这一步单纯为了在日志里留下「实际编译器版本 >= 声明基线」的证据。
      - name: Baseline
        run: |
          rustc -V
          grep -E '^(edition|rust-version)' Cargo.toml

      - name: Format
        run: cargo fmt --all --check

      # scripts/net_faults/ 下 12 个 shell 文件此前没有任何闸门（cargo 不管它们）。
      # 只做语法检查：不跑场景（需要 root + netem，进不了 CI）。
      - name: Shell syntax
        run: |
          n=0
          for f in scripts/net_faults/*.sh scripts/net_faults/scenarios/*.sh; do
            [ -e "$f" ] || continue
            bash -n "$f" || { echo "syntax error: $f"; exit 1; }
            n=$((n+1))
          done
          echo "shell syntax OK ($n files)"

      # issue #15：**不内置任何下载源**。除 docs/ 与 tests/ 外，src/ 里不该出现任何源地址。
      # 这条是机器判据 —— 少写一行注释不会被发现，多写一行硬编码却会被它抓住。
      - name: No built-in sources
        run: |
          if grep -rnE 'piston-meta|launchermeta|launcher\.mojang|bmclapi|download\.minecraft|meta\.fabricmc|files\.minecraftforge|maven\.minecraftforge|maven\.neoforged|resources\.download|libraries\.minecraft' src/; then
            echo "::error::src/ 里不该出现下载源地址（issue #15）"
            exit 1
          fi
          echo "no built-in sources OK"
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # 为什么不用 services：services 的容器里建监听，runner 连不到那个端口；
      # 而用例要动态建 proxy（端口随机）。直接在 runner 本机跑二进制最省事。
      - name: Start toxiproxy
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/toxiproxy-server \
            https://github.com/Shopify/toxiproxy/releases/download/v2.11.0/toxiproxy-server-linux-amd64
          chmod +x /tmp/toxiproxy-server
          nohup /tmp/toxiproxy-server -host 127.0.0.1 -port 8474 > /tmp/toxiproxy.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8474/proxies >/dev/null; then echo "toxiproxy up"; exit 0; fi
            sleep 0.5
          done
          echo "toxiproxy 没起来："; cat /tmp/toxiproxy.log; exit 1

      - name: Test
        env:
          TOXIPROXY_ADDR: 127.0.0.1:8474
          TOXIPROXY_REQUIRED: "1"
          # 稀疏文件语义是 spec §5.3 的硬判据。CI 是 ext4 必然支持，
          # 设此变量让「文件系统不支持稀疏」时的 SKIP 直接判失败 ——
          # 否则 SKIP 在 cargo test 里等同 passed，这条防线形同虚设。
          REQUIRE_SPARSE: "1"
        run: cargo test --all-targets --locked

      # 本地也跑得了（CARGO_TARGET_DIR 指到仓库外即可绕开沙箱的路径限制）。
      # 放这里是为了两件本地替代不了的事：Linux 平台，以及 --locked 的一致性。
      - name: Build (release)
        run: cargo build --release --locked

  # 发布物是 .exe，而 Windows 专属分支在 ubuntu 上**要么不编译、要么不执行**：
  # `cfg!(windows)` 的运行时分支（NTFS ADS / 保留名 / 大小写不敏感比较）、`#[cfg(windows)]` 的测试、
  # 以及 `use std::io::Write` 这种平台限定的导入。这类分歧已经咬过三次（本地绿、CI 红）。
  check-windows:
    runs-on: windows-latest
    env:
      TEST_FLOOR: 195
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          rustup update stable
          rustup component add rustfmt clippy
          cargo -V && rustc -V

      - uses: Swatinem/rust-cache@v2

      # 不设 REQUIRE_SPARSE：读它的测试文件整个 `#![cfg(target_os = "linux")]`，
      # 在这个平台上根本不存在 —— 设了就是一个没人读的开关，日志上像有保护，实际没有。
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        env:
        run: cargo test --all-targets --locked

      # `0 tests` / SKIP / 被删掉的测试，在 cargo 输出里和 passed 长得一样。
      # 唯一的机器判据是"确实列出了这么多条"。
      - name: Test count floor
        shell: bash
        run: |
          n=$(cargo test --all-targets --locked -- --list 2>/dev/null | grep -c ': test$')
          echo "listed $n tests (floor ${TEST_FLOOR})"
          [ "$n" -ge "$TEST_FLOOR" ] || { echo "::error::only $n tests listed"; exit 1; }

  # `rust-version = "1.99"` 如果没人用 1.99 编一次，它就只是一条注释：
  # `clippy::incompatible_msrv` 只查 std API，不查语言特性（let-chain 这类），更不查依赖的 MSRV。
  # `--locked` 必须带：否则 cargo 会按 MSRV 重新解析，把"能不能编"偷换成"能不能解"。
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check at declared MSRV
        run: cargo check --all-targets --locked

      - name: Clippy at declared MSRV
        run: cargo clippy --all-targets --locked -- -D warnings
