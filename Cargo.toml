[package]
name = "mc-downloader"
version = "0.5.0"
edition = "2021"
description = "从 Mojang 官方 CDN 下载 Minecraft，或安装 Modrinth 格式整合包"
license = "MIT"
readme = "README.md"
# 最低支持版本：cargo 会在这条不满足时直接拒绝编译。
# 刻意不用 rust-toolchain.toml 钉 channel —— 那会让 rustup 每次去同步 channel 元数据，
# 离线 / 代理受限时连 cargo 都跑不起来。
rust-version = "1.99"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
futures = "0.3"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
