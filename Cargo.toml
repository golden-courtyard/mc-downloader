[package]
name = "mc-downloader"
version = "0.5.0"
edition = "2024"
description = "从 Mojang 官方 CDN 下载 Minecraft，或安装 Modrinth 格式整合包"
license = "MIT"
readme = "README.md"
# 最低支持版本：cargo 会在这条不满足时直接拒绝编译。
# 刻意不用 rust-toolchain.toml 钉 channel —— 那会让 rustup 每次去同步 channel 元数据，
# 离线 / 代理受限时连 cargo 都跑不起来。
rust-version = "1.99"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
futures = "0.3"
toml = "0.8"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# 刻意**不设** panic = "abort" —— 2026-10-21 已实测（实验与原始输出留在
# C:\hub\reference\rust\panic-lab\）：
#
#   unwind（当前）：worker panic → tokio 接成 JoinError → 下面那三态 match 的
#                   第三分支可达 → abort flusher、落 .part.state、返回错误
#                   → 进程正常退出。实测 path=Err(JoinError) is_panic=true。
#   abort        ：panic 瞬间整个进程终止（实测 exit 0xc0000409），
#                   那条 JoinError 分支**永远走不到**，收尾三步全部跳过，
#                   .part.state 丢掉最后一次快照之后的进度。
#
# ⇒ 收益（少一份展开表、panic 路径略快）抵不上代价（把「单个分片 bug」
#   升级成「整进程死、来不及落盘」，正好抵消分片级续传要保的东西）。
# ⇒ 同时这也证明 `Err(join_err)` 那条分支不是死代码，unwind 下真实可达。
#
# 另：release 构建**本地跑得了**，不是「只有 CI 能跑」——沙箱只拦
# <repo>/target/release 这个固定路径，用 CARGO_TARGET_DIR 指到仓库外即可：
#   CARGO_TARGET_DIR=/tmp/mcd-rel cargo build --release --locked
# 实测产出 4.48 MB 且跑通 vanilla 1.7.10 回归。
#
# 也不必额外跑 `cargo test --release`：`unsafe_code = "forbid"` 已经排除了
# LTO 改变语义的常见原因（UB），剩下的差异只在性能，不在正确性。

# ── 语法 / 语言基线 ────────────────────────────────────────────────
# edition 只是「允许」2024 的写法，下面的 lint 才让它变成「要求」。
# 放在 Cargo.toml 而不是 lib.rs 的 `#![warn]`：一处声明，lib / bin / test / bench
# 四个 target 同时生效，不会漏。
[lints.rust]
# 全仓不允许 unsafe。将来真要加（比如 mmap 或 SIMD），必须先改这里 —— 强制讨论一次。
unsafe_code = "forbid"
# 不退回 2021 语义：if-let 临时值作用域、尾部表达式 drop 顺序、RPIT 捕获等
# 十几条迁移 lint 一起 deny。写出在 2021/2024 下行为不同的代码会直接编译失败。
# priority = -1 是为了让下面单条 lint（默认 priority 0）能覆盖 group
rust_2024_compatibility = { level = "deny", priority = -1 }
# 2024 起的语法点：`gen` 等新关键字被当作标识符就直接报错
keyword_idents_2024 = "deny"
# 冗余的 `mut` / 未使用的结果必须处理，不能靠肉眼
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
# 防的是「用了比 rust-version 更新的 API」—— 基线要能自己守住，不能靠人记
incompatible_msrv = "deny"
# 下面几条是**推动现代写法**的，不是风格洁癖：
manual_let_else = "warn"   # 促使 match -> let-else
redundant_clone = "warn"
needless_pass_by_value = "warn"

[dev-dependencies]
proptest = "1"
rstest = "0.23"

